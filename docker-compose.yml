services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: abdul-ahad-omer-portfolio:latest
    container_name: omer-portfolio
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: "file:/data/dev.db"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
    volumes:
      - omer-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  omer-data:
